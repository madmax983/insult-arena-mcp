[package]
name = "insult-arena-mcp"
version = "0.1.0"
edition = "2024"
description = "LLM vs LLM Monkey Island-style insult sword fighting over MCP"
license = "MIT"
repository = "https://github.com/YOUR_USERNAME/insult-arena-mcp"
keywords = ["mcp", "llm", "game", "monkey-island", "claude"]
categories = ["games", "network-programming"]

[dependencies]
# MCP Server
rust-mcp-sdk = { version = "0.8", features = ["server", "hyper-server", "macros"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
significant_drop_tightening = "allow"  # False positive for async mutex guards
